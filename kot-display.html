<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Order Display - KOT System</title>
    <link href="assets/dist/css/bundle.min.css" rel="stylesheet">
    <style>
        body {
            background: #2c3e50;
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
            height: 100vh;
        }

        .display-container {
            max-width: 1400px;
            margin: 0 auto;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #34495e;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .restaurant-name {
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .time-display {
            font-size: 1.5rem;
            opacity: 0.9;
        }

        .orders-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            overflow-y: auto;
            padding: 10px;
        }

        .order-card {
            background: #34495e;
            border-radius: 10px;
            padding: 20px;
            border-left: 5px solid #3498db;
            position: relative;
            transition: all 0.3s ease;
        }

        .order-card.new {
            border-left-color: #e74c3c;
            animation: newOrderPulse 2s infinite;
        }

        .order-card.urgent {
            border-left-color: #f39c12;
        }

        .order-card.ready {
            border-left-color: #27ae60;
            opacity: 0.7;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 10px;
        }

        .order-number {
            font-size: 1.8rem;
            font-weight: bold;
            color: #3498db;
        }

        .order-time {
            font-size: 1.2rem;
            opacity: 0.8;
        }

        .order-type {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .dine-in {
            background: #27ae60;
        }

        .takeaway {
            background: #f39c12;
        }

        .delivery {
            background: #e74c3c;
        }

        .order-items {
            margin-bottom: 15px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .item-name {
            font-weight: 500;
            flex: 1;
        }

        .item-quantity {
            background: rgba(52, 152, 219, 0.3);
            padding: 3px 8px;
            border-radius: 10px;
            margin: 0 10px;
            font-weight: bold;
        }

        .item-notes {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-left: 10px;
            font-style: italic;
        }

        .order-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn-action {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-ready {
            background: #27ae60;
            color: white;
        }

        .btn-ready:hover {
            background: #229954;
        }

        .btn-snooze {
            background: #f39c12;
            color: white;
        }

        .btn-snooze:hover {
            background: #e67e22;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            opacity: 0.7;
            grid-column: 1 / -1;
        }

        .empty-state h3 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .empty-state p {
            font-size: 1.3rem;
        }

        .status-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-new {
            background: #e74c3c;
            color: white;
        }

        .status-preparing {
            background: #f39c12;
            color: white;
        }

        .status-ready {
            background: #27ae60;
            color: white;
        }

        @keyframes newOrderPulse {
            0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }

        .notification-sound {
            display: none;
        }

        .priority-high {
            border-left-color: #e74c3c !important;
        }

        .priority-medium {
            border-left-color: #f39c12 !important;
        }

        .priority-low {
            border-left-color: #3498db !important;
        }

        .preparation-time {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="display-container">
        <div class="header">
            <div class="restaurant-name" id="restaurantName">Kitchen Display System</div>
            <div class="time-display" id="currentTime">--:--:--</div>
        </div>

        <div class="orders-grid" id="ordersGrid">
            <div class="empty-state">
                <h3>No Pending Orders</h3>
                <p>All orders have been processed. Waiting for new orders...</p>
            </div>
        </div>
    </div>

    <audio class="notification-sound" id="newOrderSound">
        <source src="assets/sounds/new-order.mp3" type="audio/mpeg">
    </audio>

    <script>
        const { ipcRenderer } = require('electron');

        let orders = [];
        let settings = {};
        let languageSupport = null;

        // Try to load language support
        try {
            // Load language support module
            const script = document.createElement('script');
            script.src = 'assets/js/language.js';
            script.onload = function() {
                if (window.LanguageSupport) {
                    languageSupport = window.LanguageSupport;
                    console.log('✅ Language support loaded in KOT display');
                    updateDisplayLanguage();
                }
            };
            document.head.appendChild(script);
        } catch (error) {
            console.warn('⚠️ Language support not available in KOT display:', error);
        }

        function updateTime() {
            const now = new Date();
            $('#currentTime').text(now.toLocaleTimeString());
        }

        function updateDisplayLanguage() {
            if (!languageSupport || !settings) return;
            
            const kotLanguage = languageSupport.getCurrentKOTLanguage();
            
            // Apply font family for Hindi text if needed
            const fontFamily = kotLanguage === 'hindi' || kotLanguage === 'bilingual' ? 
                "'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Devanagari Sangam MN'" : 
                "'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
            
            document.body.style.fontFamily = fontFamily;
            
            // Update static text based on language
            if (kotLanguage !== 'english') {
                const getTrans = (key) => {
                    if (kotLanguage === 'bilingual') {
                        return languageSupport.getBilingualText(key);
                    }
                    return languageSupport.getText(key, kotLanguage);
                };
                
                // Update empty state text
                $('.empty-state h3').text(getTrans('kitchen_order_ticket'));
                $('.empty-state p').text('All orders have been processed. Waiting for new orders...');
                
                // Update action buttons
                $('.btn-ready').text(getTrans('ready'));
                $('.btn-snooze').text('Snooze');
            }
        }

        function getTranslatedText(key, fallback) {
            if (!languageSupport) return fallback;
            
            const kotLanguage = languageSupport.getCurrentKOTLanguage();
            if (kotLanguage === 'english') return fallback;
            
            if (kotLanguage === 'bilingual') {
                return languageSupport.getBilingualText(key);
            }
            
            const translated = languageSupport.getText(key, kotLanguage);
            return translated || fallback;
        }

        function updateOrdersDisplay(orderData) {
            orders = orderData || [];
            const grid = $('#ordersGrid');

            if (orders.length === 0) {
                const emptyTitle = getTranslatedText('kitchen_order_ticket', 'Kitchen Order Ticket');
                grid.html(`
                    <div class="empty-state">
                        <h3>${emptyTitle}</h3>
                        <p>All orders have been processed. Waiting for new orders...</p>
                    </div>
                `);
                return;
            }

            let html = '';
            orders.forEach(order => {
                const orderTime = new Date(order.timestamp);
                const timeAgo = Math.floor((Date.now() - orderTime) / 60000); // minutes ago
                const timeDisplay = timeAgo < 1 ? 'Just now' : `${timeAgo} min ago`;

                let orderClass = '';
                let statusClass = 'status-new';
                let statusText = getTranslatedText('new', 'NEW');

                if (order.status === 'preparing') {
                    orderClass = '';
                    statusClass = 'status-preparing';
                    statusText = getTranslatedText('preparing', 'PREPARING');
                } else if (order.status === 'ready') {
                    orderClass = 'ready';
                    statusClass = 'status-ready';
                    statusText = getTranslatedText('ready', 'READY');
                } else if (timeAgo > 10) {
                    orderClass = 'urgent';
                } else if (timeAgo > 5) {
                    orderClass = 'new';
                }

                let orderTypeClass = 'dine-in';
                let orderTypeText = getTranslatedText('dine_in', 'Dine-in');
                if (order.type === 'takeaway') {
                    orderTypeClass = 'takeaway';
                    orderTypeText = getTranslatedText('takeaway', 'Takeaway');
                } else if (order.type === 'delivery') {
                    orderTypeClass = 'delivery';
                    orderTypeText = getTranslatedText('delivery', 'Delivery');
                }

                let itemsHtml = '';
                order.items.forEach(item => {
                    itemsHtml += `
                        <div class="order-item">
                            <span class="item-name">${item.name}</span>
                            <span class="item-quantity">${item.quantity}</span>
                            ${item.notes ? `<span class="item-notes">${item.notes}</span>` : ''}
                        </div>
                    `;
                });

                const readyText = getTranslatedText('ready', 'Mark Ready');
                const snoozeText = 'Snooze';

                html += `
                    <div class="order-card ${orderClass}" data-order-id="${order.id}">
                        <div class="status-indicator ${statusClass}">${statusText}</div>
                        <div class="order-header">
                            <div class="order-number">#${order.number}</div>
                            <div class="order-type ${orderTypeClass}">${orderTypeText}</div>
                        </div>
                        <div class="order-time">${timeDisplay}</div>
                        <div class="order-items">
                            ${itemsHtml}
                        </div>
                        ${order.estimatedTime ? `<div class="preparation-time">Est. ${order.estimatedTime} min</div>` : ''}
                        <div class="order-actions">
                            <button class="btn-action btn-ready" onclick="markOrderReady('${order.id}')">
                                ${readyText}
                            </button>
                            <button class="btn-action btn-snooze" onclick="snoozeOrder('${order.id}')">
                                ${snoozeText}
                            </button>
                        </div>
                    </div>
                `;
            });

            grid.html(html);

            // Play sound for new orders
            if (orders.some(o => o.status === 'new')) {
                playNotificationSound();
            }
        }

        function markOrderReady(orderId) {
            ipcRenderer.send('kot-order-ready', { orderId });
        }

        function snoozeOrder(orderId) {
            ipcRenderer.send('kot-order-snooze', { orderId });
        }

        function playNotificationSound() {
            const audio = document.getElementById('newOrderSound');
            if (audio) {
                audio.play().catch(e => {
                    // Ignore autoplay policy errors
                    console.log('Could not play notification sound:', e);
                });
            }
        }

        function updateRestaurantInfo(settingsData) {
            settings = settingsData || {};
            if (settings.store) {
                $('#restaurantName').text(`${settings.store} - Kitchen Display`);
            }
            
            // Update display language based on settings
            updateDisplayLanguage();
        }

        // Listen for updates from main process
        ipcRenderer.on('kot-display-update', (event, data) => {
            if (data.type === 'orders') {
                updateOrdersDisplay(data.orders);
            } else if (data.type === 'settings') {
                updateRestaurantInfo(data.settings);
            }
        });

        // Initial setup
        $(document).ready(function() {
            updateTime();
            setInterval(updateTime, 1000);

            // Request current orders data
            ipcRenderer.send('kot-display-ready');
        });

        // Handle keyboard shortcuts
        $(document).keydown(function(e) {
            // Space bar to mark first order as ready
            if (e.keyCode === 32) {
                e.preventDefault();
                const firstOrder = $('.order-card:not(.ready)').first();
                if (firstOrder.length) {
                    const orderId = firstOrder.data('order-id');
                    markOrderReady(orderId);
                }
            }
        });
    </script>
</body>
</html>
